<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tab icon: the SVG wherever it's supported, a PNG elsewhere, and a
         full-bleed square for iOS home screens (iOS rounds it itself). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenValence</title>
    <!-- Dark mode before first paint, so a dark-mode reader never sees a white
         flash. src/lib/themeStore.ts takes over from here; keep the two in sync. -->
    <script>
      try {
        var theme = localStorage.getItem("chemia.theme");
        if (theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Runs on every push to main and every pull request: the web app's lint,
# tests and build, then the .NET build and tests and a check of the practice
# question files. Nothing here needs a database or API keys.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  dotnet:
    name: .NET and questions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build OpenValence.slnx
      - run: dotnet test --project tests/tests.csproj --no-build
      - name: Check the practice question files
        run: dotnet run --project ingest --no-build -- questions --check
